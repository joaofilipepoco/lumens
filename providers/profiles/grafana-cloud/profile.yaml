provider: grafana-cloud
support: certified
recommended_topology: direct_otlp
supported_topologies: [direct_otlp, customer_collector]
application_configuration: standard_otel
endpoint_variable: OTEL_EXPORTER_OTLP_ENDPOINT
headers_variable: OTEL_EXPORTER_OTLP_HEADERS
signals: [traces, metrics, logs]
credential_owner: client_secret_manager_or_customer_collector
notes: Configure the Grafana Cloud OTLP endpoint and authorization header through standard OTEL settings; verify stack and access-policy scopes.
