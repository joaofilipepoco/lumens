provider: datadog
support: certified
recommended_topology: provider_agent
supported_topologies: [provider_agent, customer_collector, direct_otlp]
application_configuration: standard_otel
endpoint_variable: OTEL_EXPORTER_OTLP_ENDPOINT
headers_variable: OTEL_EXPORTER_OTLP_HEADERS
signals: [traces, metrics, logs]
credential_owner: datadog_agent_or_customer_collector
notes: Prefer Datadog Agent OTLP ingestion. The application points OTEL_EXPORTER_OTLP_ENDPOINT at the Agent; DD_API_KEY belongs to the Agent, not to the application.
