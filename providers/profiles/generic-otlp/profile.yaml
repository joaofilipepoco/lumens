provider: generic-otlp
support: otlp-compatible
recommended_topology: customer_collector
supported_topologies: [customer_collector, direct_otlp]
application_configuration: standard_otel
endpoint_variable: OTEL_EXPORTER_OTLP_ENDPOINT
headers_variable: OTEL_EXPORTER_OTLP_HEADERS
signals: [traces, metrics, logs]
credential_owner: client
notes: The client validates compatibility and supplies destination authentication through standard OTEL configuration.
