name: deploy-ecs-pilot

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag; default is the selected commit SHA
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "infra/**"
      - "java/**"
      - "python/**"
      - ".github/workflows/deploy-ecs-pilot.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  TF_VAR_name_prefix: ${{ vars.LUMENS_NAME_PREFIX }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_dynatrace_otlp_endpoint: ${{ vars.DYNATRACE_OTLP_ENDPOINT }}
  TF_VAR_dynatrace_headers_secret_name: ${{ vars.DYNATRACE_HEADERS_SECRET_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v5
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify application and contract artifacts
        run: ./scripts/verify.sh
      - name: Initialize Terraform
        working-directory: infra/ecs
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=ecs-pilot/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$TF_LOCK_TABLE" -backend-config="encrypt=true"
      - name: Validate Terraform
        working-directory: infra/ecs
        run: terraform fmt -check && terraform validate
      - name: Create image repositories and Dynatrace secret container
        working-directory: infra/ecs
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.bff -target=aws_ecr_repository.integration -target=aws_secretsmanager_secret.dynatrace_headers
      - name: Resolve ECR repositories
        id: ecr
        working-directory: infra/ecs
        run: |
          echo "bff=$(terraform output -raw bff_repository_url)" >> "$GITHUB_OUTPUT"
          echo "integration=$(terraform output -raw integration_repository_url)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Java Spring Boot BFF
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          docker build -f examples/java-bff/Dockerfile -t "${{ steps.ecr.outputs.bff }}:$IMAGE_TAG" .
          docker push "${{ steps.ecr.outputs.bff }}:$IMAGE_TAG"
      - name: Build and push Python FastAPI integration
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          docker build -f examples/python-integration/Dockerfile -t "${{ steps.ecr.outputs.integration }}:$IMAGE_TAG" .
          docker push "${{ steps.ecr.outputs.integration }}:$IMAGE_TAG"
      - name: Store Dynatrace header in AWS Secrets Manager
        env:
          DYNATRACE_HEADERS: ${{ secrets.DYNATRACE_OTLP_HEADERS }}
        run: |
          test -n "$DYNATRACE_HEADERS"
          aws secretsmanager put-secret-value --secret-id "$TF_VAR_dynatrace_headers_secret_name" --secret-string "$DYNATRACE_HEADERS"
      - name: Deploy ECS services
        working-directory: infra/ecs
        env:
          TF_VAR_image_tag: ${{ inputs.image_tag || github.sha }}
        run: terraform apply -input=false -auto-approve
      - name: Wait for ECS service stability
        working-directory: infra/ecs
        run: |
          CLUSTER="${{ vars.LUMENS_NAME_PREFIX }}-cluster"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "${{ vars.LUMENS_NAME_PREFIX }}-python-integration" "${{ vars.LUMENS_NAME_PREFIX }}-java-bff"
      - name: Smoke test public BFF
        working-directory: infra/ecs
        run: curl --fail --retry 12 --retry-delay 5 "$(terraform output -raw bff_url)/enrich"
      - name: Show public BFF URL
        working-directory: infra/ecs
        run: echo "BFF URL: $(terraform output -raw bff_url)"
