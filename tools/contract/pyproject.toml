[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lumens-contract-tools"
version = "0.1.0"
description = "Lumens semantic contract validation and generation"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
]

[project.scripts]
lumens-contract = "lumens_contract.cli:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lumens_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
